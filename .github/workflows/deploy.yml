name: Deploy web

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: false

env:
  APP_DIR: /opt/govmeeting/web
  PM2_APP: govmeeting-web

jobs:
  deploy:
    name: Check, build, ship, reload
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      # See pr.yml — lucide-react's react peer range makes this mandatory.
      - name: Install
        run: npm ci --legacy-peer-deps

      # Advisory for the same reason as in pr.yml — 5 pre-existing errors must
      # not block a deploy.
      - name: Lint (advisory)
        continue-on-error: true
        run: npm run lint

      # Building here rather than on the instance is the point: `next build`
      # wants 2–4 GiB and both cores, and the box is serving traffic.
      # INTERNAL_API_URL is a build input (see pr.yml).
      - name: Build
        env:
          INTERNAL_API_URL: http://127.0.0.1:4000
          NEXT_PUBLIC_WEB_URL: https://calendar.gov.sl
        run: npm run build

      - name: Check the API rewrite was baked in
        run: |
          dest=$(node -e "console.log(require('./.next/routes-manifest.json').rewrites.beforeFiles[0].destination)")
          echo "rewrite destination: $dest"
          [ "$dest" = "http://127.0.0.1:4000/api/:path*" ] || {
            echo "::error::unexpected rewrite destination: $dest"; exit 1; }

      # GitHub masks secret values in logs, so a bad one cannot be printed. This
      # reports its shape instead, and fails here rather than inside scp with
      # "hostname contains invalid characters" and no indication which secret is
      # at fault. Whitespace is stripped because a trailing newline pasted into
      # the secret box is the usual culprit.
      #
      # Named SSH_USER, not USER: the runner already defines USER.
      - name: Validate deploy secrets
        env:
          IN_HOST: ${{ secrets.EC2_HOST }}
          IN_USER: ${{ secrets.EC2_USER }}
          IN_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          host=$(printf '%s' "$IN_HOST" | tr -d '[:space:]')
          user=$(printf '%s' "$IN_USER" | tr -d '[:space:]')
          [ -n "$host" ] || { echo "::error::EC2_HOST is empty or unset"; exit 1; }
          [ -n "$user" ] || { echo "::error::EC2_USER is empty or unset"; exit 1; }
          [ -n "$IN_KEY" ] || { echo "::error::EC2_SSH_KEY is empty or unset"; exit 1; }
          case "$host" in
            *://*) echo "::error::EC2_HOST has a scheme. Use a bare host or IP: 44.215.193.61, not https://44.215.193.61"; exit 1 ;;
            *@*)   echo "::error::EC2_HOST includes a user. Put the login in EC2_USER and only the host here"; exit 1 ;;
            *:*)   echo "::error::EC2_HOST includes a port or path. Use only the host or IP"; exit 1 ;;
            */*)   echo "::error::EC2_HOST includes a path. Use only the host or IP"; exit 1 ;;
          esac
          case "$user" in
            *@*|*/*|*:*) echo "::error::EC2_USER must be just the login name, e.g. ec2-user"; exit 1 ;;
          esac
          case "$IN_KEY" in
            *"OPENSSH PRIVATE KEY"*|*"RSA PRIVATE KEY"*|*"EC PRIVATE KEY"*) ;;
            *) echo "::error::EC2_SSH_KEY does not look like a private key. Paste the whole file including the BEGIN/END lines — not the .pub"; exit 1 ;;
          esac
          echo "host length ${#host}, user length ${#user}, key length ${#IN_KEY}"
          echo "SSH_HOST=$host" >> "$GITHUB_ENV"
          echo "SSH_USER=$user" >> "$GITHUB_ENV"

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # `|| true` and touch: if keyscan returns nothing, the chmod that
          # followed used to fail on a missing file and end the step with a bare
          # exit 1 — hiding whatever ssh would have said. Let ssh report the
          # real problem instead.
          touch ~/.ssh/known_hosts
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          chmod 600 ~/.ssh/known_hosts
          # Fails clearly on a wrong key or a closed port 22, rather than
          # letting the first real command carry the blame.
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes \
            "$SSH_USER@$SSH_HOST" 'echo "connected to $(hostname)"'

      # tar over scp rather than rsync: rsync has to exist on BOTH ends, and the
      # Amazon Linux AMI does not ship it. tar and scp are always there.
      #
      # Only build output and manifests travel. .env and logs/ live on the
      # instance and are never in the archive, so they cannot be clobbered.
      - name: Package build output
        run: |
          tar czf deploy.tar.gz \
            .next public package.json package-lock.json \
            next.config.ts ecosystem.config.js
          ls -lh deploy.tar.gz

      - name: Upload
        run: |
          scp -i ~/.ssh/deploy_key -o IdentitiesOnly=yes \
            deploy.tar.gz "$SSH_USER@$SSH_HOST:/tmp/web-deploy.tar.gz"

      # --omit=dev keeps cypress (hundreds of MB) and eslint off the instance.
      # `next start` needs only the production dependencies.
      #
      # Reload names one app: the API shares this PM2 daemon, and
      # `pm2 reload all` would restart it on every web deploy.
      - name: Install production dependencies and reload
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes "$SSH_USER@$SSH_HOST" bash -euo pipefail <<EOF
            cd $APP_DIR
            # Unpack beside the live build and swap, so .next is never partially
            # written underneath a running next start. Merging instead would
            # leave last release's chunks behind for a client holding an old
            # manifest to request.
            rm -rf .incoming && mkdir .incoming
            tar xzf /tmp/web-deploy.tar.gz -C .incoming
            rm -f /tmp/web-deploy.tar.gz
            rm -rf .next public
            mv .incoming/.next .next
            mv .incoming/public public
            mv .incoming/package.json .incoming/package-lock.json \
               .incoming/next.config.ts .incoming/ecosystem.config.js .
            rm -rf .incoming
            npm ci --omit=dev --legacy-peer-deps
            mkdir -p logs
            pm2 reload $PM2_APP --update-env
            pm2 save
          EOF

      - name: Verify
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes "$SSH_USER@$SSH_HOST" bash -euo pipefail <<'EOF'
            code=""
            # `if` rather than `curl ... && break`, so a failed attempt does not
            # trip set -e and abort the retry loop on the first try.
            for i in $(seq 1 12); do
              if code=$(curl -fsS -o /dev/null -w '%{http_code}' --max-time 5 http://127.0.0.1:3000/); then break; fi
              echo "waiting for next start ($i/12)"; sleep 5
            done
            [ -n "$code" ] || { echo "::error::web did not respond within 60s"; exit 1; }
            echo "web responded $code"
            # Through the rewrite, so a working page with a broken API link is
            # still a failed deploy.
            curl -fsS --max-time 10 http://127.0.0.1:3000/api/v1/health > /dev/null \
              || { echo "::error::web is up but /api/* does not reach the API"; exit 1; }
          EOF

      - name: Report failure
        if: failure()
        run: |
          echo "::error::Deploy failed. The previous build is still running on the instance — PM2 only reloads after the new build has landed."
