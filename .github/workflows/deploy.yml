name: Deploy web

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: false

env:
  APP_DIR: /opt/govmeeting/web
  PM2_APP: govmeeting-web

jobs:
  deploy:
    name: Check, build, ship, reload
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      # See pr.yml — lucide-react's react peer range makes this mandatory.
      - name: Install
        run: npm ci --legacy-peer-deps

      # Advisory for the same reason as in pr.yml — 5 pre-existing errors must
      # not block a deploy.
      - name: Lint (advisory)
        continue-on-error: true
        run: npm run lint

      # Building here rather than on the instance is the point: `next build`
      # wants 2–4 GiB and both cores, and the box is serving traffic.
      # INTERNAL_API_URL is a build input (see pr.yml).
      - name: Build
        env:
          INTERNAL_API_URL: http://127.0.0.1:4000
          NEXT_PUBLIC_WEB_URL: https://calendar.gov.sl
        run: npm run build

      - name: Check the API rewrite was baked in
        run: |
          dest=$(node -e "console.log(require('./.next/routes-manifest.json').rewrites.beforeFiles[0].destination)")
          echo "rewrite destination: $dest"
          [ "$dest" = "http://127.0.0.1:4000/api/:path*" ] || {
            echo "::error::unexpected rewrite destination: $dest"; exit 1; }

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          HOST: ${{ secrets.EC2_HOST }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          chmod 600 ~/.ssh/known_hosts

      # --delete on .next/ so stale chunks from the previous build cannot be
      # served to a client holding an old manifest. Nothing else is deleted:
      # .env and logs/ belong to the instance.
      - name: Ship build output
        env:
          HOST: ${{ secrets.EC2_HOST }}
          USER: ${{ secrets.EC2_USER }}
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes" \
            .next/ "$USER@$HOST:$APP_DIR/.next/"
          rsync -az \
            -e "ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes" \
            public/ "$USER@$HOST:$APP_DIR/public/"
          rsync -az \
            -e "ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes" \
            package.json package-lock.json next.config.ts ecosystem.config.js \
            "$USER@$HOST:$APP_DIR/"

      # --omit=dev keeps cypress (hundreds of MB) and eslint off the instance.
      # `next start` needs only the production dependencies.
      #
      # Reload names one app: the API shares this PM2 daemon, and
      # `pm2 reload all` would restart it on every web deploy.
      - name: Install production dependencies and reload
        env:
          HOST: ${{ secrets.EC2_HOST }}
          USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes "$USER@$HOST" bash -euo pipefail <<EOF
            cd $APP_DIR
            npm ci --omit=dev --legacy-peer-deps
            mkdir -p logs
            pm2 reload $PM2_APP --update-env
            pm2 save
          EOF

      - name: Verify
        env:
          HOST: ${{ secrets.EC2_HOST }}
          USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes "$USER@$HOST" bash -euo pipefail <<'EOF'
            code=""
            # `if` rather than `curl ... && break`, so a failed attempt does not
            # trip set -e and abort the retry loop on the first try.
            for i in $(seq 1 12); do
              if code=$(curl -fsS -o /dev/null -w '%{http_code}' --max-time 5 http://127.0.0.1:3000/); then break; fi
              echo "waiting for next start ($i/12)"; sleep 5
            done
            [ -n "$code" ] || { echo "::error::web did not respond within 60s"; exit 1; }
            echo "web responded $code"
            # Through the rewrite, so a working page with a broken API link is
            # still a failed deploy.
            curl -fsS --max-time 10 http://127.0.0.1:3000/api/v1/health > /dev/null \
              || { echo "::error::web is up but /api/* does not reach the API"; exit 1; }
          EOF

      - name: Report failure
        if: failure()
        run: |
          echo "::error::Deploy failed. The previous build is still running on the instance — PM2 only reloads after a successful rsync."
